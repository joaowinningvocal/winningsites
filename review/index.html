<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site review</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 4h20a3 3 0 0 1 3 3v13a3 3 0 0 1-3 3H14l-7 6v-6H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z' fill='%232F6BFF'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/review/review.css">
</head>
<body>

<header class="bar">
  <div class="bar__group">
    <span class="bar__title" data-i18n="title">Site review</span>
    <div class="tabs" id="site-tabs" role="tablist" aria-label="Sites"></div>
    <label class="page-pick">
      <span class="sr-only" data-i18n="page">Page</span>
      <select id="page-select"></select>
    </label>
  </div>
  <div class="bar__group bar__group--end">
    <a class="bar__link" id="open-live" target="_blank" rel="noopener" data-i18n="liveSite">Current live site</a>
    <a class="bar__link" id="open-preview" target="_blank" rel="noopener" data-i18n="openPreview">Open preview</a>
    <div class="menu-wrap">
      <button class="bar__btn" id="export-btn" aria-haspopup="true" aria-expanded="false" data-i18n="export">Export</button>
      <div class="menu" id="export-menu" hidden>
        <button type="button" data-export="copy" data-i18n="exportCopy">Copy open comments (Markdown)</button>
        <button type="button" data-export="download" data-i18n="exportDownload">Download all comments</button>
      </div>
    </div>
    <button class="bar__btn" id="lang-btn" aria-label="Language">PT</button>
    <button class="bar__btn bar__you" id="name-btn"></button>
    <button class="bar__btn panel-toggle" id="panel-btn" aria-controls="panel" aria-expanded="false"><span data-i18n="comments">Comments</span> <b id="panel-count">0</b></button>
  </div>
</header>

<div class="main">
  <section class="canvas" id="canvas" aria-label="Preview">
    <div class="frame-wrap" id="frame-wrap" data-device="desktop">
      <iframe id="frame" title="Site preview"></iframe>
    </div>

    <div class="toolbar" role="toolbar" aria-label="Review tools">
      <div class="tool-group" id="tools">
        <button class="tool" data-mode="browse" aria-pressed="true">
          <svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z"/></svg>
          <span data-i18n="browse">Browse</span><kbd>V</kbd>
        </button>
        <button class="tool" data-mode="pin" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M4 5h16v11H11l-5 4v-4H4z"/></svg>
          <span data-i18n="pin">Comment</span><kbd>C</kbd>
        </button>
        <button class="tool" data-mode="arrow" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9"/></svg>
          <span data-i18n="arrow">Arrow</span><kbd>A</kbd>
        </button>
        <button class="tool" data-mode="box" aria-pressed="false">
          <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg>
          <span data-i18n="box">Highlight</span><kbd>B</kbd>
        </button>
      </div>
      <span class="tool-sep"></span>
      <div class="tool-group" id="devices">
        <button class="tool tool--icon" data-device="desktop" aria-pressed="true" data-i18n-title="desktop" title="Desktop">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M9 20h6M12 16v4"/></svg>
        </button>
        <button class="tool tool--icon" data-device="tablet" aria-pressed="false" data-i18n-title="tablet" title="Tablet">
          <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M11 18h2"/></svg>
        </button>
        <button class="tool tool--icon" data-device="mobile" aria-pressed="false" data-i18n-title="mobile" title="Mobile">
          <svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg>
        </button>
      </div>
      <span class="tool-sep"></span>
      <button class="tool tool--icon" id="visible-btn" aria-pressed="true" data-i18n-title="toggleVisible" title="Show comments on the page">
        <svg viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <form class="composer" id="composer" hidden>
      <label class="sr-only" for="composer-text" data-i18n="composerLabel">Your comment</label>
      <textarea id="composer-text" rows="3" data-i18n-placeholder="composerPlaceholder" placeholder="What should change here?"></textarea>
      <div class="composer__row">
        <span class="composer__hint" data-i18n="composerHint">Ctrl+Enter to save</span>
        <button type="button" class="btn-ghost" id="composer-cancel" data-i18n="cancel">Cancel</button>
        <button type="submit" class="btn-primary" data-i18n="save">Save comment</button>
      </div>
    </form>
  </section>

  <aside class="panel" id="panel" aria-label="Comments">
    <div class="panel__head">
      <div class="seg" role="group" aria-label="Scope">
        <button data-scope="page" aria-pressed="true" data-i18n="thisPage">This page</button>
        <button data-scope="all" aria-pressed="false" data-i18n="allPages">All pages</button>
      </div>
      <div class="seg" role="group" aria-label="Status">
        <button data-status="open" aria-pressed="true"><span data-i18n="open">Open</span> <b data-count="open">0</b></button>
        <button data-status="resolved" aria-pressed="false"><span data-i18n="resolved">Resolved</span> <b data-count="resolved">0</b></button>
      </div>
    </div>
    <ol class="list" id="list"></ol>
    <div class="empty" id="empty" hidden></div>
  </aside>
</div>

<div class="modal" id="name-modal" hidden>
  <form class="modal__card" id="name-form">
    <h2 data-i18n="nameTitle">What's your name?</h2>
    <p data-i18n="nameBody">It shows next to your comments so everyone knows who asked for what.</p>
    <label class="sr-only" for="name-input" data-i18n="nameLabel">Your name</label>
    <input id="name-input" autocomplete="name" maxlength="60" required>
    <div class="modal__row"><button type="submit" class="btn-primary" data-i18n="continue">Continue</button></div>
  </form>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/review/review.js"></script>
</body>
</html>
